name: appnuno
description: "Application de suivi d'entraînement musculation"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  provider: ^6.1.2
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  fl_chart: ^0.69.2
  
  uuid: ^4.5.1
  
  intl: ^0.19.0
  
  flutter_lucide: ^1.6.0

  # Alerte de fin de repos (notification programmée qui vibre)
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.0

  # Partage de la carte de bilan
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Hive Generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  
  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Police Barlow (licence SIL Open Font License, voir assets/fonts),
  # embarquée pour fonctionner hors connexion.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
